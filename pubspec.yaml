name: capcap
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  google_sign_in: ^7.2.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  photo_manager: ^3.12.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

# cấu hình icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # Tùy chọn cho Android

  # Cấu hình icon cho Desktop
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256 # Kích thước icon tối đa cho Windows
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
